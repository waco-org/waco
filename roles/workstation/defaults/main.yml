---
# Workstation as Code
# Copyright Nicola Musatti 2020 - 2026.

# The components to install
waco_has_docker: false
waco_has_java: false
waco_has_maven: false
waco_has_python: false
waco_has_hiwthi: false

# System settings (role system): mDNS through firewalld, so that printers and
# scanners are discovered; a persistent journal, and its size limit (e.g. 1G);
# sudoers drop-ins, as {name, content} or {name, src}
waco_mdns_firewall: true
waco_journal_persistent: true
waco_journal_max_use:
waco_sudoers: []

# Permanent print queues, and queues to remove (role printing)
waco_printing_queues: []
waco_printing_queues_absent: []

# Apps to install system-wide, by name in the app catalog (roles/apps/vars/catalog.yml)
waco_apps: []

# Apps of waco_apps not to install here. Settings lists only add to each
# other (machine.yml to type.yml), so this is how a machine drops an app of its
# type, e.g. one with no source yet on a new distro release.
waco_apps_exclude: []

# Catalog entries to add or override, merged recursively over the shipped catalog
waco_apps_catalog_extra: {}

# Warn instead of failing when an app has no source on the platform
waco_apps_allow_missing: false

# Distro packages to install. They must exist on every distro release the host may run.
waco_packages: []

# Flatpak apps to install system-wide, for apps not in the catalog
waco_flatpak_apps: []

# Users that must exist. What goes in their home directories is left to them
# (or to a home-directory tool).
waco_users: []
