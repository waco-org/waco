---
# Workstation as Code
# Copyright Nicola Musatti 2020 - 2026.

# The components to install
waco_has_docker: false
waco_has_maven: false
waco_has_python: false

# Apps to install system-wide, by name in the app catalog (roles/apps/vars/catalog.yml)
waco_apps: []

# Catalog entries to add or override, merged recursively over the shipped catalog
waco_apps_catalog_extra: {}

# Warn instead of failing when an app has no source on the platform
waco_apps_allow_missing: false

# Distro packages to install. They must exist on every distro release the host may run.
waco_packages: []

# Flatpak apps to install system-wide, for apps not in the catalog
waco_flatpak_apps: []

# Users that must exist, and their settings. Each user's settings are merged
# over waco_user_defaults, e.g.:
# waco_user_settings:
#   nick:
#     has_rust: true
#     apps: [dropbox]
#     flatpak_apps: [org.freac.freac]
#     python_versions: ["3.13"]
#     python_tools: [{name: tox, with: [tox-uv]}]
waco_users: []
waco_user_settings: {}
waco_user_defaults:
  has_rust: false
  apps: []
  flatpak_apps: []
  python_versions: []
  python_tools: []
