# python3-debian is needed by ansible.builtin.deb822_repository.
- name: Install the packages needed to add apt repositories
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    update_cache: true
    cache_valid_time: 3600
  become: true
