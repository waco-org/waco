- name: Install snaps
  when: (snap_apps + snap_classic_apps) | length > 0
  block:
    - name: Check that the platform uses snap
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: snap is only supported on Ubuntu; the Red Hat family uses Flatpak

    - name: Install snapd
      ansible.builtin.apt:
        name: snapd
      become: true

    - name: Start snapd
      ansible.builtin.systemd_service:
        name: snapd.socket
        state: started
        enabled: true
      become: true

    # community.general.snap reports a failed install without snapd's reason,
    # so on failure snapd's own record is shown before failing.
    - name: Install the snaps
      block:
        - name: Install the snaps with strict confinement
          community.general.snap:
            name: "{{ snap_apps }}"
          become: true
          when: snap_apps | length > 0

        - name: Install the snaps with classic confinement
          community.general.snap:
            name: "{{ snap_classic_apps }}"
            classic: true
          become: true
          when: snap_classic_apps | length > 0
      rescue:
        - name: Ask snapd what went wrong
          ansible.builtin.shell: |
            snap changes
            snap tasks --last=install
          register: snap_diagnosis
          changed_when: false
          failed_when: false
          become: true

        - name: Fail with snapd's account of the install
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg }}\n{{ snap_diagnosis.stdout }}\n{{ snap_diagnosis.stderr }}"
