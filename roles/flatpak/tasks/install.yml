# On Ubuntu the natural source is snap, so the apps catalog picks Flatpak there
# only as a recorded exception; this role installs whatever it is given.
- name: Install flatpak apps
  when: flatpak_apps | length > 0
  block:
    - name: Install flatpak
      ansible.builtin.package:
        name: flatpak
      become: true

    - name: Add the remote {{ flatpak_remote }}
      community.general.flatpak_remote:
        name: "{{ flatpak_remote }}"
        flatpakrepo_url: "{{ flatpak_remote_url }}"
        method: "{{ flatpak_method }}"
      become: true
      become_user: "{{ flatpak_owner }}"

    - name: Install the apps
      community.general.flatpak:
        name: "{{ flatpak_apps }}"
        remote: "{{ flatpak_remote }}"
        method: "{{ flatpak_method }}"
      become: true
      become_user: "{{ flatpak_owner }}"
