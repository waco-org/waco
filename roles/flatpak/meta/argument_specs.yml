argument_specs:
  main:
    short_description: Install flatpak apps system-wide
    options:
      flatpak_apps:
        type: list
        elements: str
        default: []
        description: Flatpak app IDs, e.g. org.musicbrainz.Picard.
      flatpak_remote:
        type: str
        default: flathub
        description: Name of the remote the apps come from.
      flatpak_remote_url:
        type: str
        default: https://dl.flathub.org/repo/flathub.flatpakrepo
        description: URL of the remote's .flatpakrepo file.
