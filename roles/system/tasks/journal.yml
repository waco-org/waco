---
# Workstation as Code
# Copyright Nicola Musatti 2026.

# A drop-in rather than creating /var/log/journal, which Storage=auto would
# also pick up: it states the intent.

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
  become: true
  when: system_journal_persistent or system_journal_max_use

- name: Configure the journal
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/waco.conf
    mode: "0644"
  become: true
  notify: Restart journald
  when: system_journal_persistent or system_journal_max_use

- name: Leave the journal to the distro's default
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/waco.conf
    state: absent
  become: true
  notify: Restart journald
  when: not (system_journal_persistent or system_journal_max_use)
