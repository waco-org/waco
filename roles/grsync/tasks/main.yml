# Not every distro has grsync (EL10 doesn't), so look for the package
# rather than hard-coding where it exists.
- name: Check whether a grsync package is available
  ansible.builtin.command: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('dnf -q list grsync', 'apt-cache show grsync') }}"
  register: grsync_available
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Warn that grsync is skipped
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      has no grsync package; skipped
  when: grsync_available.rc != 0

- name: Install grsync
  ansible.builtin.package:
    name: grsync
  become: true
  when: grsync_available.rc == 0
