# Workstation as Code
# Copyright Nicola Musatti 2020 - 2026.

# The distro Python serves the system side only. Python versions and tools
# for development come from uv, which each user installs in their own home.

- name: Check whether a uv package is available
  ansible.builtin.command: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('dnf -q list uv', 'apt-cache show uv') }}"
  register: python_uv_package
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Install uv from the distro
  ansible.builtin.package:
    name: uv
  become: true
  when: python_uv_package.rc == 0

- name: Install uv from its GitHub release
  ansible.builtin.include_tasks: uv-release.yml
  when: python_uv_package.rc != 0
