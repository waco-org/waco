# Oracle's signing key ships with the role (files/oracle_vbox_2016.asc,
# fingerprint B9F8 D658 297A F3EF C18D 5CDF A2F6 83C5 2980 AECF) because
# Oracle's download server too often answered 410 Gone. If the repository no
# longer verifies with it, the key is downloaded from Oracle and the install
# retried, with a warning: replace the shipped file then (the weekly
# check-repo-keys workflow reports it too).
#
# Conceptually the download is the direct approach and the shipped file the
# workaround, but the shipped key is tried first on purpose: tried second, it
# would only be used when the download fails, so a stale or expired file would
# go unnoticed until the one moment it was needed.

- name: Install the shipped signing key
  ansible.builtin.copy:
    src: "{{ virtualbox_key_src }}"
    dest: "{{ virtualbox_key_path }}"
    mode: "0644"
  become: true

- name: Add the VirtualBox repository (Red Hat family)
  ansible.builtin.yum_repository:
    name: virtualbox
    description: Oracle VirtualBox
    baseurl: "https://download.virtualbox.org/virtualbox/rpm/{{ virtualbox_rpm_distro }}/{{ ansible_facts['distribution_major_version'] }}/$basearch"
    gpgkey: "file://{{ virtualbox_key_path }}"
    gpgcheck: true
    repo_gpgcheck: true
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Add the VirtualBox repository (Ubuntu)
  ansible.builtin.deb822_repository:
    name: virtualbox
    uris: https://download.virtualbox.org/virtualbox/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: contrib
    signed_by: "{{ virtualbox_key_path }}"
  become: true
  register: virtualbox_apt_repo
  when: ansible_facts['os_family'] == 'Debian'

- name: Install VirtualBox
  block:
    - name: Install VirtualBox with the shipped key
      ansible.builtin.include_tasks: install.yml
      vars:
        virtualbox_refresh: "{{ virtualbox_apt_repo is changed }}"

  rescue:
    - name: Download Oracle's current signing key
      ansible.builtin.get_url:
        url: "{{ virtualbox_key_url }}"
        dest: "{{ virtualbox_key_path }}"
        mode: "0644"
        force: true
      become: true

    - name: Warn that the shipped key is stale
      ansible.builtin.debug:
        msg: >-
          WARNING: installing VirtualBox failed with the key shipped in the virtualbox role,
          so Oracle's current key was downloaded from {{ virtualbox_key_url }} and the
          install retried. Replace roles/virtualbox/files/oracle_vbox_2016.asc.

    - name: Install VirtualBox with the downloaded key
      ansible.builtin.include_tasks: install.yml
      vars:
        virtualbox_refresh: true
