- name: Add the VirtualBox repository (Red Hat family)
  ansible.builtin.yum_repository:
    name: virtualbox
    description: Oracle VirtualBox
    baseurl: "https://download.virtualbox.org/virtualbox/rpm/{{ virtualbox_rpm_distro }}/{{ ansible_facts['distribution_major_version'] }}/$basearch"
    gpgkey: https://www.virtualbox.org/download/oracle_vbox_2016.asc
    gpgcheck: true
    repo_gpgcheck: true
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Add the VirtualBox repository (Ubuntu)
  ansible.builtin.deb822_repository:
    name: virtualbox
    uris: https://download.virtualbox.org/virtualbox/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: contrib
    signed_by: https://www.virtualbox.org/download/oracle_vbox_2016.asc
  become: true
  register: virtualbox_apt_repo
  when: ansible_facts['os_family'] == 'Debian'

- name: Install VirtualBox (Red Hat family)
  ansible.builtin.dnf:
    name: "{{ virtualbox_rpm_package }}"
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install VirtualBox (Ubuntu)
  ansible.builtin.apt:
    name: "{{ virtualbox_deb_package }}"
    update_cache: "{{ virtualbox_apt_repo is changed }}"
  become: true
  when: ansible_facts['os_family'] == 'Debian'
