---
- name: Converge
  hosts: all
  roles:
    - role: waco_org.waco.workstation
  vars:
    waco_packages:
      - "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('vim-X11', 'vim-gui-common') }}"
    waco_flatpak_apps:
      - org.musicbrainz.Picard
    waco_sudoers:
      - name: user-true
        content: |
          user ALL=(root) NOPASSWD: /usr/bin/true
    # A PPD of its own, so that no printer is needed
    waco_printing_queues:
      - name: waco-test
        uri: ipp://192.0.2.1/ipp/print
        ppd: "{{ playbook_dir }}/../printing/files/test.ppd"
        default: true
    waco_has_docker: true
    docker_users: ["user"]
    # The test containers can't run the Docker daemon
    start_service: false
    waco_has_java: true
    java_versions: [21, 25]
    java_default: 21
    waco_has_maven: true
    waco_has_python: true
    waco_apps: [grsync, packer, vagrant, virtualbox, vscode]
    # grsync has no source on EL10
    waco_apps_allow_missing: true
    # uid 1001 like a second account, so that the docker account gets 1000;
    # vboxusers only exists once VirtualBox is installed, later in the run
    waco_users:
      - {name: user, uid: 1001, admin: true, groups: [vboxusers]}
    waco_user_settings:
      user:
        has_rust: true
        apps: [dropbox]
        flatpak_apps:
          - org.freac.freac
        python_versions: ["3.13"]
        python_tools:
          - name: tox
            with: [tox-uv]
