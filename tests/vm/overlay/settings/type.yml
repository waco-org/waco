---
# Workstation as Code
# Copyright Nicola Musatti 2026.

# Test settings for the VM tier: what the workstation-complete scenario
# installs, here on a real install where services run. Copied over the
# settings clone in the VM (guest/bootstrap).

waco_has_docker: true
docker_users: [vagrant, user]
waco_has_java: true
java_versions: [25, 11]
java_default: 25
waco_has_maven: true
waco_has_python: true

waco_mdns_firewall: true
waco_journal_persistent: true
waco_sudoers:
  - name: user-true
    content: |
      user ALL=(root) NOPASSWD: /usr/bin/true

# exclude_apps in boxes.yml: apps this distro can't install yet
waco_apps: [grsync, packer, vagrant, virtualbox, vscode]
waco_apps_exclude: "{{ waco_vm_exclude_apps | default([]) }}"
waco_packages:
  - "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('vim-X11', 'vim-gui-common') }}"
waco_flatpak_apps:
  - org.musicbrainz.Picard

# A PPD of its own, so that no printer is needed
waco_printing_queues:
  - name: waco-test
    uri: ipp://192.0.2.1/ipp/print
    ppd: "{{ playbook_dir }}/local/cups/test.ppd"
    default: true

# vagrant, the box's admin, has uid 1000, so the docker role skips its uid-1000
# account with a warning, as on a machine whose first user took 1000.
# vboxusers only exists once VirtualBox is installed, later in the run.
waco_users:
  - name: user
    uid: 1001
    groups: "{{ ['vboxusers'] if 'virtualbox' not in (waco_vm_exclude_apps | default([])) else [] }}"
