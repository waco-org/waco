# Workstation as Code
# Copyright Nicola Musatti 2026.

# Boxes for Waco's VM tier, one Vagrant machine each (see README.md).
#
#   box:       the name it gets in "vagrant box list"
#   format:    "vagrant" (a Vagrant box) or "ova" (a cloud image OVA, turned
#              into a box by add-box; cloud-init creates the vagrant user)
#   url:       where it comes from, always an official image of the distro
#   sha256:    taken from the distro's signed checksum file, whose signature
#              was checked when the entry was added (README.md, "Boxes")
#   checksums: that checksum file, for the next update
#   exclude_apps: apps of the test settings that can't be installed on this
#              distro yet, each with the reason

rocky10:
